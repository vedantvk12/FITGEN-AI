      <text x="16" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF"><tspan fill="#00FF87">1.</tspan> Dumbbell Floor Press</text>
      
      <rect x="360" y="12" width="130" height="20" rx="4" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)"/>
      <text x="370" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#38BDF8">🛡️ Pectorals, Triceps</text>

      <rect x="500" y="12" width="115" height="20" rx="4" fill="rgba(0,255,135,0.12)" stroke="rgba(0,255,135,0.3)"/>
      <text x="512" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#00FF87">3 Sets × 10-12 Reps</text>

      <rect x="625" y="12" width="95" height="20" rx="4" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)"/>
      <text x="637" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#FBBF24">⏱️ 60s Rest</text>

      <text x="16" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Execution: Lower with controlled 3-second descent, touch elbows lightly to floor, press upward explosively.</text>
      <line x1="16" y1="60" x2="859" y2="60" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8"><tspan fill="#38BDF8" font-weight="700">💡 Form Cue:</tspan> Keep elbows at 45-degree angle to protect shoulder capsule.</text>
      <text x="460" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8"><tspan fill="#F59E0B" font-weight="700">⚠️ Modification:</tspan> Reduce dumbbell weight if lower back arches.</text>
    </g>

    <!-- Exercise 2 -->
    <g transform="translate(0, 212)">
      <rect width="875" height="90" rx="8" fill="#121824" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF"><tspan fill="#00FF87">2.</tspan> Bent-Over Dumbbell Row</text>
      
      <rect x="360" y="12" width="130" height="20" rx="4" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)"/>
      <text x="370" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#38BDF8">🦅 Lats, Rhomboids</text>

      <rect x="500" y="12" width="115" height="20" rx="4" fill="rgba(0,255,135,0.12)" stroke="rgba(0,255,135,0.3)"/>
      <text x="512" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#00FF87">3 Sets × 10-12 Reps</text>

      <rect x="625" y="12" width="95" height="20" rx="4" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)"/>
      <text x="637" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#FBBF24">⏱️ 60s Rest</text>

      <text x="16" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Execution: Hinge at hips with flat spine, pull weights toward hip crease, squeezing shoulder blades together.</text>
      <line x1="16" y1="60" x2="859" y2="60" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8"><tspan fill="#38BDF8" font-weight="700">💡 Form Cue:</tspan> Drive movement with elbows, not biceps.</text>
      <text x="460" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8"><tspan fill="#F59E0B" font-weight="700">⚠️ Modification:</tspan> Rest one hand on a bench for chest-supported row if needed.</text>
    </g>

    <!-- Exercise 3 -->
    <g transform="translate(0, 312)">
      <rect width="875" height="90" rx="8" fill="#121824" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF"><tspan fill="#00FF87">3.</tspan> Plank with Shoulder Taps</text>
      
      <rect x="360" y="12" width="130" height="20" rx="4" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)"/>
      <text x="370" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#38BDF8">🎯 Core &amp; Shoulders</text>

      <rect x="500" y="12" width="115" height="20" rx="4" fill="rgba(0,255,135,0.12)" stroke="rgba(0,255,135,0.3)"/>
      <text x="512" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#00FF87">3 Sets × 30-45 Sec</text>

      <rect x="625" y="12" width="95" height="20" rx="4" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)"/>
      <text x="637" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#FBBF24">⏱️ 45s Rest</text>

      <text x="16" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Execution: Hold push-up plank, tap opposite shoulder without allowing hips to tilt or rotate.</text>
      <line x1="16" y1="60" x2="859" y2="60" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8"><tspan fill="#38BDF8" font-weight="700">💡 Form Cue:</tspan> Widen feet stance for greater pelvic stabilization.</text>
      <text x="460" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8"><tspan fill="#F59E0B" font-weight="700">⚠️ Modification:</tspan> Drop to knees if lumbar spine sags.</text>
    </g>
