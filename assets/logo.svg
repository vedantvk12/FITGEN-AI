<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#60EFFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Symbol (Geometric Hexagonal Dumbbell / Kinetic Energy) -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hexagon -->
    <polygon points="35,5 65,22 65,58 35,75 5,58 5,22" fill="url(#cardGrad)" stroke="#00FF87" stroke-width="2.5" />
    <!-- Kinetic Dumbbell Core -->
    <rect x="20" y="36" width="30" height="8" rx="4" fill="url(#limeGrad)" filter="url(#glow)" />
    <!-- Weight Plates -->
    <rect x="15" y="24" width="7" height="32" rx="3.5" fill="#00FF87" />
    <rect x="48" y="24" width="7" height="32" rx="3.5" fill="#00FF87" />
    <rect x="10" y="29" width="4" height="22" rx="2" fill="#38BDF8" />
    <rect x="56" y="29" width="4" height="22" rx="2" fill="#38BDF8" />
    <!-- AI Core Dot -->
    <circle cx="35" cy="40" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <!-- FITGEN -->
  <text x="95" y="52" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="36" letter-spacing="2" fill="#FFFFFF">
    FITGEN
  </text>
  <!-- AI Badge -->
  <rect x="245" y="24" width="48" height="30" rx="6" fill="url(#limeGrad)" />
  <text x="254" y="46" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="19" fill="#0B0E14" letter-spacing="1">
    AI
  </text>

  <!-- Subtitle / Tagline -->
  <text x="96" y="74" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="11" letter-spacing="2.5" fill="#94A3B8">
    INTELLIGENT FITNESS ROUTINE PLANNER
  </text>
</svg>
